[package]
name = "pidra"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first Linux terminal process manager"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.4", features = ["param"] }
thiserror = "2.0.19"

[profile.release]
lto = "thin"
strip = true
